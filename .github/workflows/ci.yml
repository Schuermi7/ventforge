name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: pytest
        shell: bash
        # failures become public annotations (job logs need a GitHub login)
        run: |
          pytest -q -rf --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error::/' || true
          exit $status

  # core install only: the MCP server and 2D exports must work without Qt / OpenCascade
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: |
          cd /tmp
          python -c "from ventforge.mcp_server import list_presets, new_design, export; assert list_presets(); new_design(path='/tmp/c.vent.json'); export('/tmp/c.svg'); export('/tmp/c.dxf'); export('/tmp/c.png')"
          ventforge 2>&1 | grep -q 'ventforge\[gui\]'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, core-only]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
