[project]
name = "ventforge"
version = "0.2.0"
description = "Parametric vent pattern designer with native GUI and MCP server"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["vent", "pattern", "3d-printing", "cnc", "cad", "mcp", "parametric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
# core: geometry, SVG/DXF/PNG export and the MCP server
dependencies = ["numpy", "shapely>=2", "ezdxf", "pillow", "mcp>=2,<3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]           # desktop editor (QtCore/QtGui/QtWidgets only)
cad = ["cadquery-ocp-novtk>=8.0,<8.1"]      # OpenCascade: STEP/STL, tube wrap, cut into part
all = ["ventforge[gui,cad]"]
dev = ["ventforge[all]", "pytest"]

[project.scripts]
ventforge = "ventforge.__main__:run"        # editor; `ventforge --mcp` runs the MCP server
ventforge-mcp = "ventforge.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ventforge", "ventforge.presets"]  # presets: data-only folder shipped in the wheel

[tool.setuptools.package-data]
"ventforge.presets" = ["*.vent.json"]
"ventforge" = ["fusion/VentForge/*.py", "fusion/VentForge/*.manifest"]  # Fusion add-in, copied by install-fusion
